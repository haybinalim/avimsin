[project]
name = "avimsin"
version = "0.1.0"
description = "Avımsın — Smart wallet bulucu ve takipçi: erken alıcıları toplar, botları eler, en iyi cüzdanları sıralar"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "haybinalim" }]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.scripts]
avimsin-rpc = "avimsin.rpc_check:main"
avimsin-scan = "avimsin.scan:main"
avimsin-filter = "avimsin.filter:main"
avimsin-score = "avimsin.score:main"
avimsin-watch = "avimsin.watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avimsin"]
